version: "3"

includes:
  brew: ./tasks/brew.yml
  chezmoi: ./tasks/chezmoi.yml
  shell: ./tasks/shell.yml
  terminal: ./tasks/terminal.yml
  vscode: ./tasks/vscode.yml
  doctor: ./tasks/doctor.yml
  check: ./tasks/check.yml

tasks:
  bootstrap:
    desc: Bootstrap a new macOS machine
    cmds:
      - task: preflight
      - task: apply

  apply:
    desc: Install missing software and apply managed configuration
    cmds:
      - task: preflight
      - task: chezmoi:preflight
      - task: brew:apply
      - task: chezmoi:apply
      - task: shell:apply
      - task: vscode:apply
      - task: doctor

  diff:
    desc: Preview chezmoi changes
    cmds:
      - task: chezmoi:diff

  update:
    desc: Explicitly update Homebrew formulae and Zsh plugins
    cmds:
      - task: preflight
      - task: brew:update
      - task: shell:update
      - task: check
      - git diff -- home/dot_zsh_plugins_pre.txt home/dot_zsh_plugins_post.txt

  doctor:
    desc: Diagnose the declared environment without changing it
    cmds:
      - task: doctor:run

  check:
    desc: Run repository checks and smoke tests
    cmds:
      - task: check:run
      - task: shell:check
      - task: terminal:check

  preflight:
    internal: true
    cmds:
      - test "$(uname -s)" = Darwin
      - command -v brew >/dev/null
      - command -v task >/dev/null
      - command -v chezmoi >/dev/null
      - command -v python3 >/dev/null
