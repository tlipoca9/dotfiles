version: "3"

includes:
  platform:
    taskfile: ./platform/darwin/Taskfile.yml
    internal: true
  chezmoi: ./tasks/chezmoi.yml
  pi: ./tasks/pi.yml
  shell: ./tasks/shell.yml
  terminal: ./tasks/terminal.yml
  doctor: ./tasks/doctor.yml
  check: ./tasks/check.yml

tasks:
  bootstrap:
    desc: Bootstrap a new macOS machine
    cmds:
      - task: preflight
      - task: apply

  apply:
    desc: Install missing software and apply managed configuration
    cmds:
      - task: preflight
      - task: chezmoi:preflight
      - task: platform:packages-apply
      - task: chezmoi:apply
      - task: shell:apply
      - task: pi:apply
      - task: platform:vscode-apply
      - task: doctor

  diff:
    desc: Preview chezmoi changes
    cmds:
      - task: chezmoi:diff

  update:
    desc: Explicitly update Homebrew formulae and Zsh plugins
    cmds:
      - task: preflight
      - task: platform:packages-update
      - task: shell:update
      - task: pi:apply
      - task: check
      - git diff -- home/dot_zsh_plugins_pre.txt home/dot_zsh_plugins_post.txt

  doctor:
    desc: Diagnose the declared environment without changing it
    cmds:
      - task: doctor:run

  check:
    desc: Run repository checks and smoke tests
    cmds:
      - task: check:run
      - task: shell:check
      - task: terminal:check
      - task: platform:check

  preflight:
    internal: true
    cmds:
      - task: platform:preflight
