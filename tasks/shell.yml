version: '3'

vars:
  PLUGIN_TOOL: '{{.ROOT_DIR}}/scripts/zsh_plugins.py'
  PRE_MANIFEST: '{{.ROOT_DIR}}/home/dot_zsh_plugins_pre.txt'
  POST_MANIFEST: '{{.ROOT_DIR}}/home/dot_zsh_plugins_post.txt'

tasks:
  apply:
    internal: true
    cmds:
      - python3 {{.PLUGIN_TOOL | shellQuote}} bundle {{.PRE_MANIFEST | shellQuote}} {{.POST_MANIFEST | shellQuote}}

  update:
    internal: true
    cmds:
      - python3 {{.PLUGIN_TOOL | shellQuote}} update {{.PRE_MANIFEST | shellQuote}} {{.POST_MANIFEST | shellQuote}}
      - task: apply

  check:
    internal: true
    cmds:
      - /bin/zsh -n {{.ROOT_DIR | shellQuote}}/home/dot_zshrc
      - |
        set -eu
        config={{.ROOT_DIR | shellQuote}}/home/dot_config/starship.toml
        if command -v starship >/dev/null 2>&1; then
          STARSHIP_CONFIG="$config" starship print-config >/dev/null
        elif python3 -c 'import tomllib' >/dev/null 2>&1; then
          python3 - "$config" <<'PY'
        import sys
        import tomllib

        with open(sys.argv[1], "rb") as config_file:
            tomllib.load(config_file)
        PY
        fi
      - python3 {{.PLUGIN_TOOL | shellQuote}} check {{.PRE_MANIFEST | shellQuote}} {{.POST_MANIFEST | shellQuote}}
      - python3 {{.ROOT_DIR | shellQuote}}/scripts/doctor.py --only-zsh --source-zsh
