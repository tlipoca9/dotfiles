version: "3"

vars:
  EXTENSION_ID: Catppuccin.catppuccin-vsc
  APP_CODE_CLI: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code

tasks:
  apply:
    internal: true
    desc: Install the managed VS Code extension
    cmds:
      - |
        code_cli="$(command -v code || true)"
        if [ -z "$code_cli" ]; then
          code_cli="{{.APP_CODE_CLI}}"
        fi
        if [ ! -x "$code_cli" ]; then
          printf 'VS Code CLI not found at %s\n' "$code_cli" >&2
          exit 1
        fi
        "$code_cli" --install-extension "{{.EXTENSION_ID}}"

  check:
    internal: true
    desc: Verify the managed VS Code extension
    cmds:
      - |
        code_cli="$(command -v code || true)"
        if [ -z "$code_cli" ]; then
          code_cli="{{.APP_CODE_CLI}}"
        fi
        if [ ! -x "$code_cli" ]; then
          printf 'VS Code CLI not found at %s\n' "$code_cli" >&2
          exit 1
        fi
        "$code_cli" --list-extensions | awk -v id="{{.EXTENSION_ID}}" '
          tolower($0) == tolower(id) { found = 1 }
          END {
            if (!found) {
              printf "VS Code extension not installed: %s\n", id > "/dev/stderr"
              exit 1
            }
          }
        '
