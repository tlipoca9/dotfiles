version: '3'

tasks:
  check:
    internal: true
    cmds:
      - |
        set -eu
        config={{.ROOT_DIR | shellQuote}}/home/dot_config/ghostty/config
        ghostty=''
        if command -v ghostty >/dev/null 2>&1; then
          ghostty=$(command -v ghostty)
        fi
        if [ -n "$ghostty" ]; then
          "$ghostty" +validate-config --config-file="$config"
        elif ! awk '
          /^[[:space:]]*($|#)/ { next }
          /^[[:space:]]*[a-z0-9-]+[[:space:]]*=[[:space:]]*.+$/ { next }
          { exit 1 }
        ' "$config"; then
          echo "invalid Ghostty config syntax: $config" >&2
          exit 1
        fi
