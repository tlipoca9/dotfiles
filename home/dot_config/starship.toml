format = """
[╭─](overlay0)$directory$git_branch$git_status$git_state$git_metrics$fill$nodejs$python$rust$golang$cmd_duration
[╰─](overlay0)$character"""
add_newline = false
palette = "catppuccin_mocha"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = false

[git_branch]
style = "bold mauve"
symbol = " "

[git_status]
style = "peach"

[git_state]
style = "yellow"

[git_metrics]
disabled = false

[fill]
symbol = " "

[nodejs]
format = "via [$symbol($version )]($style)"
style = "green"

[python]
format = "via [$symbol($version )]($style)"
style = "yellow"

[rust]
format = "via [$symbol($version )]($style)"
style = "peach"

[golang]
format = "via [$symbol($version )]($style)"
style = "blue"

[cmd_duration]
min_time = 1000
format = "took [$duration]($style)"
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"
vimcmd_replace_one_symbol = "[❮](bold peach)"
vimcmd_replace_symbol = "[❮](bold peach)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
