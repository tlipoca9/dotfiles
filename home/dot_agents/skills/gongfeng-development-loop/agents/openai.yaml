interface:
  display_name: "Gongfeng Development Loop"
  short_description: "在工蜂中持续同步研发 Issue 契约并自动交付 PR/MR"
  default_prompt: "Use $gongfeng-development-loop to implement this change with a continuously synchronized Gongfeng Issue and a final PR/MR."

dependencies:
  tools:
    - type: "mcp"
      value: "gongfeng"
      description: "Gongfeng Issue and merge-request operations for git.woa.com"
      transport: "streamable_http"
      url: "https://git.woa.com/api/mcp/mcp"

policy:
  allow_implicit_invocation: true
