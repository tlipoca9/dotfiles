name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install upstream validation tools
        run: brew install chezmoi antidote fzf starship zoxide

      - name: Validate initialization without external Git
        shell: bash
        run: |
          set -euo pipefail
          builtin_root="$RUNNER_TEMP/dotfiles-builtin-git"
          rm -rf "$builtin_root"
          mkdir -p "$builtin_root/work" "$builtin_root/fake-bin" "$builtin_root/home"
          /usr/bin/git -C "$builtin_root/work" init -q
          /usr/bin/git -C "$builtin_root/work" config user.email ci@example.invalid
          /usr/bin/git -C "$builtin_root/work" config user.name 'Dotfiles CI'
          printf 'builtin git\n' >"$builtin_root/work/dot_probe"
          /usr/bin/git -C "$builtin_root/work" add dot_probe
          /usr/bin/git -C "$builtin_root/work" -c core.hooksPath=/dev/null commit -qm fixture
          /usr/bin/git clone -q --bare "$builtin_root/work" "$builtin_root/origin.git"
          cat >"$builtin_root/fake-bin/git" <<'SH'
          #!/bin/sh
          printf 'external git invoked\n' >>"${POISON_GIT_LOG:?}"
          exit 97
          SH
          chmod +x "$builtin_root/fake-bin/git"
          : >"$builtin_root/poison-git.log"
          HOME="$builtin_root/home" \
          PATH="$builtin_root/fake-bin:$PATH" \
          POISON_GIT_LOG="$builtin_root/poison-git.log" \
            chezmoi --source "$builtin_root/source" \
              --destination "$builtin_root/home" \
              --config /dev/null --config-format toml \
              --cache "$builtin_root/cache" \
              --persistent-state "$builtin_root/state.boltdb" \
              init --apply --use-builtin-git=true "file://$builtin_root/origin.git"
          test "$(cat "$builtin_root/home/.probe")" = 'builtin git'
          test ! -s "$builtin_root/poison-git.log"
          grep -F -- 'init --apply --use-builtin-git=true \' README.md

      - name: Validate declarations and managed JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          for path in root.rglob("*.toml"):
              if ".git" in path.parts or ".local" in path.parts:
                  continue
              tomllib.loads(path.read_text())

          data_root = root / "home/.chezmoidata/darwin"
          logical_id_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._+-]*")
          homebrew_name_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._+@/-]*")
          command_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._+-]*")

          def validate_packages(packages):
              assert isinstance(packages, dict) and packages
              allowed = {"manager", "kind", "name", "check"}
              for logical_id, package in packages.items():
                  assert isinstance(logical_id, str) and logical_id_pattern.fullmatch(logical_id)
                  assert isinstance(package, dict) and set(package) <= allowed
                  assert package.get("manager") == "homebrew"
                  assert package.get("kind") in {"formula", "cask"}
                  resolved_name = package.get("name", logical_id)
                  assert isinstance(resolved_name, str)
                  assert homebrew_name_pattern.fullmatch(resolved_name)
                  if "check" in package:
                      check = package["check"]
                      assert isinstance(check, dict) and set(check) == {"command"}
                      assert isinstance(check["command"], str)
                      assert command_pattern.fullmatch(check["command"])

          packages = tomllib.loads((data_root / "packages.toml").read_text())["darwin"]["packages"]
          validate_packages(packages)
          assert packages["lean_ctx"]["name"] == "yvgude/lean-ctx/lean-ctx"
          assert homebrew_name_pattern.fullmatch("yvgude/lean-ctx/lean-ctx")
          assert "go-task" not in {p.get("name", key) for key, p in packages.items()}

          unsafe_tokens = (
              "-leading-dash", "white space", "line\nbreak", "tab\tcharacter",
              "'single-quote", '"double-quote', "$dollar", "`backtick`",
              "semi;colon", "pipe|operator", "amp&operator", "redirect>operator",
              "redirect<operator", "paren(operator)",
          )
          for pattern in (logical_id_pattern, homebrew_name_pattern, command_pattern):
              assert all(pattern.fullmatch(token) is None for token in unsafe_tokens)

          malicious_package_fixtures = {
              "multiline": '''
          [darwin.packages.multiline]
          manager = "homebrew"
          kind = "formula"
          name = """safe
          touch /tmp/dotfiles-package-sentinel
          #"""
          ''',
              "command-substitution": '''
          [darwin.packages.substitution]
          manager = "homebrew"
          kind = "formula"
          name = "$(touch /tmp/dotfiles-package-sentinel)"
          ''',
          }
          for fixture_name, fixture in malicious_package_fixtures.items():
              fixture_packages = tomllib.loads(fixture)["darwin"]["packages"]
              try:
                  validate_packages(fixture_packages)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"malicious package fixture was accepted: {fixture_name}")

          vscode = tomllib.loads((data_root / "vscode.toml").read_text())["darwin"]["vscode"]
          assert set(vscode) == {"extensions"}
          extensions = vscode["extensions"]
          assert extensions and len(extensions) == len(set(extensions))
          assert all(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]+", item) for item in extensions)

          plugin_pattern = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+ pin:[0-9a-f]{40}$")
          plugins = []
          for name in ("pre", "post"):
              lines = (root / f"home/dot_zsh_plugins_{name}.txt").read_text().splitlines()
              assert lines and all(plugin_pattern.fullmatch(line) for line in lines)
              plugins.extend(line.split()[0] for line in lines)
          assert len(plugins) == len(set(plugins))

          modifier = root / "home/dot_pi/private_agent/modify_settings.json"
          rendered = subprocess.run(
              [str(modifier)], input='{"runtimeOwned": true}', text=True,
              stdout=subprocess.PIPE, check=True,
          ).stdout
          settings = json.loads(rendered)
          assert settings["runtimeOwned"] is True
          pins = settings["packages"]
          assert len(pins) == 19 == len(set(pins))
          assert all(re.fullmatch(r"npm:(?:@[^/]+/)?[^@/]+@\d+\.\d+\.\d+", pin) for pin in pins)

          for path in root.rglob("*.json"):
              if path == modifier or ".git" in path.parts or ".local" in path.parts:
                  continue
              json.loads(path.read_text())
          PY

      - name: Render and validate chezmoi source state
        shell: bash
        run: |
          set -euo pipefail
          check_root="$RUNNER_TEMP/dotfiles-check"
          rm -rf "$check_root"
          mkdir -p "$check_root/home" "$check_root/cache" "$check_root/rendered"
          common=(
            --source "$GITHUB_WORKSPACE"
            --destination "$check_root/home"
            --config /dev/null
            --config-format toml
            --cache "$check_root/cache"
            --persistent-state "$check_root/state.boltdb"
          )

          chezmoi "${common[@]}" execute-template --init \
            --file home/.chezmoi.toml.tmpl >"$check_root/config.toml"
          python3 -c 'import sys,tomllib; tomllib.load(open(sys.argv[1], "rb"))' \
            "$check_root/config.toml"
          grep -F '/.config/chezmoi/age.txt' "$check_root/config.toml"
          ! grep -F '.local/age' "$check_root/config.toml"
          common=(
            --source "$GITHUB_WORKSPACE"
            --destination "$check_root/home"
            --config "$check_root/config.toml"
            --config-format toml
            --cache "$check_root/cache"
            --persistent-state "$check_root/state.boltdb"
          )

          for source in home/.chezmoiscripts/darwin/*.tmpl; do
            target="$check_root/rendered/$(basename "${source%.tmpl}")"
            chezmoi "${common[@]}" execute-template --file "$source" >"$target"
            test -s "$target"
            /bin/sh -n "$target"
            chezmoi "${common[@]}" --override-data '{"chezmoi":{"os":"linux"}}' \
              execute-template --file "$source" >"$target.non-darwin"
            printf '#!/bin/sh\nexit 0\n' | cmp - "$target.non-darwin"
          done

          grep -F "$(shasum -a 256 home/dot_zsh_plugins_pre.txt | awk '{print $1}')" \
            "$check_root/rendered/run_onchange_after_20-build-zsh-plugins.sh"
          grep -F "$(shasum -a 256 home/dot_zsh_plugins_post.txt | awk '{print $1}')" \
            "$check_root/rendered/run_onchange_after_20-build-zsh-plugins.sh"
          grep -F "$(shasum -a 256 home/dot_pi/private_agent/modify_settings.json | awk '{print $1}')" \
            "$check_root/rendered/run_onchange_after_40-install-pi-extensions.sh"
          package_script="$check_root/rendered/run_onchange_before_10-install-packages.sh"
          package_checksum=$(shasum -a 256 home/.chezmoidata/darwin/packages.toml | awk '{print $1}')
          grep -Fx "# Package declarations checksum: $package_checksum" "$package_script"

          dsh_patch="$check_root/rendered/cordis.patch.yml"
          chezmoi "${common[@]}" execute-template \
            --file home/dot_dsh/cordis.patch.yml.tmpl >"$dsh_patch"
          grep -Eq '^      name: ".*/\\.dsh/worktree\\.mjs"$' "$dsh_patch"
          ! grep -F '!!js dshHomePath(' "$dsh_patch"
          worktree_preset="$check_root/rendered/worktree-agent.cordis.yml"
          chezmoi "${common[@]}" execute-template \
            --file home/dot_dsh/dot_agent-presets/worktree/agent.cordis.yml.tmpl \
            >"$worktree_preset"
          grep -Eq '^  name: ".*/\\.dsh/worktree\\.mjs"$' "$worktree_preset"
          grep -F 'id: dsh-worktree-tools' "$worktree_preset"
          grep -F 'mode: agent' "$worktree_preset"
          ! grep -F 'name: {{' "$worktree_preset"

          checksum_source="$check_root/checksum-source"
          mkdir -p "$checksum_source"
          cp .chezmoiroot "$checksum_source/"
          cp -R home "$checksum_source/home"
          printf '\n# checksum-change-fixture\n' \
            >>"$checksum_source/home/.chezmoidata/darwin/packages.toml"
          changed_package_script="$check_root/rendered/run_onchange_before_10-install-packages.changed.sh"
          chezmoi --source "$checksum_source" \
            --destination "$check_root/checksum-home" \
            --config "$check_root/config.toml" --config-format toml \
            --cache "$check_root/checksum-cache" \
            --persistent-state "$check_root/checksum-state.boltdb" \
            execute-template --file home/.chezmoiscripts/darwin/run_onchange_before_10-install-packages.sh.tmpl \
            >"$changed_package_script"
          changed_package_checksum=$(shasum -a 256 \
            "$checksum_source/home/.chezmoidata/darwin/packages.toml" | awk '{print $1}')
          grep -Fx "# Package declarations checksum: $changed_package_checksum" \
            "$changed_package_script"
          test "$package_checksum" != "$changed_package_checksum"
          ! cmp -s "$package_script" "$changed_package_script"
          /bin/sh -n "$changed_package_script"

          chezmoi "${common[@]}" managed --include=scripts \
            --path-style=source-relative >"$check_root/scripts.txt"
          test "$(wc -l <"$check_root/scripts.txt" | tr -d ' ')" = 7
          order=$(chezmoi "${common[@]}" apply --dry-run --include=scripts --verbose 2>&1 \
            | sed -n 's|^diff --git a/.chezmoiscripts/darwin/\([^ ]*\).*|\1|p' \
            | paste -sd, -)
          test "$order" = \
            '00-ensure-homebrew.sh,10-install-packages.sh,15-install-dsh.sh,20-build-zsh-plugins.sh,30-install-vscode-extensions.sh,40-install-pi-extensions.sh,90-verify-ssh.sh'
          test "$(chezmoi "${common[@]}" managed --include=encrypted --path-style=relative)" = \
            '.ssh/id_ed25519'

          chezmoi "${common[@]}" managed --exclude=encrypted,scripts \
            --path-style=relative >"$check_root/managed.txt"
          grep -Fx '.pi/agent/settings.json' "$check_root/managed.txt"
          grep -Fx '.ssh/id_ed25519.pub' "$check_root/managed.txt"
          grep -Fx '.zshrc' "$check_root/managed.txt"

          chezmoi "${common[@]}" apply --exclude=encrypted,scripts
          chezmoi "${common[@]}" verify --exclude=encrypted,scripts
          test "$(stat -f '%Lp' "$check_root/home/.pi/agent")" = 700

          rm -f "$check_root/home/.ssh/id_ed25519" "$check_root/home/.ssh/id_ed25519.pub"
          ssh-keygen -q -t ed25519 -N '' -f "$check_root/home/.ssh/id_ed25519"
          chmod 600 "$check_root/home/.ssh/id_ed25519"
          chmod 644 "$check_root/home/.ssh/id_ed25519.pub"
          /bin/sh "$check_root/rendered/run_after_90-verify-ssh.sh"
          chmod 644 "$check_root/home/.ssh/id_ed25519"
          if /bin/sh "$check_root/rendered/run_after_90-verify-ssh.sh" \
            >"$check_root/ssh-check.out" 2>&1; then
            exit 1
          fi
          grep -F 'SSH private key must have mode 0600' "$check_root/ssh-check.out"

      - name: Check package interpreter behavior
        shell: bash
        run: |
          set -euo pipefail
          check_root="$RUNNER_TEMP/dotfiles-check"
          fake="$check_root/fake-bin"
          mkdir -p "$fake"
          cat >"$fake/brew" <<'SH'
          #!/bin/sh
          case "$1" in
            shellenv) printf 'export HOMEBREW_PREFIX=%s\n' "${FAKE_BREW_PREFIX:?}" ;;
            list)
              [ "$2:$4" = '--formula:age' ] || [ "$2:$4" = '--cask:chatgpt' ]
              ;;
            install) printf '%s\n' "$*" >>"${FAKE_BREW_LOG:?}" ;;
            *) exit 1 ;;
          esac
          SH
          cat >"$fake/xcode-select" <<'SH'
          #!/bin/sh
          case "$1" in
            -p) exit 1 ;;
            --install) printf 'requested\n' >>"${FAKE_CLT_LOG:?}" ;;
            *) exit 1 ;;
          esac
          SH
          chmod +x "$fake/brew" "$fake/xcode-select"
          : >"$check_root/clt.log"
          if HOME="$check_root/home" PATH="$fake:/usr/bin:/bin" \
            FAKE_CLT_LOG="$check_root/clt.log" \
            /bin/sh "$check_root/rendered/run_before_00-ensure-homebrew.sh" \
            >"$check_root/clt.out" 2>&1; then
            exit 1
          fi
          grep -F "finish installing the Command Line Tools, then run '$check_root/home/.local/bin/chezmoi apply' again" \
            "$check_root/clt.out"
          test "$(cat "$check_root/clt.log")" = requested
          cat >"$fake/xcode-select" <<'SH'
          #!/bin/sh
          [ "$1" = -p ]
          SH
          homebrew_root="$check_root/homebrew-apply"
          homebrew_source="$homebrew_root/source"
          homebrew_fake="$homebrew_root/fake-bin"
          rm -rf "$homebrew_root"
          mkdir -p "$homebrew_source/home/.chezmoiscripts/darwin" "$homebrew_fake"
          cp .chezmoiroot "$homebrew_source/"
          cp home/.chezmoiscripts/darwin/run_before_00-ensure-homebrew.sh.tmpl \
            "$homebrew_source/home/.chezmoiscripts/darwin/"
          python3 - "$homebrew_source/home/.chezmoiscripts/darwin/run_before_00-ensure-homebrew.sh.tmpl" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()
          assert content.count("/usr/libexec/path_helper") == 4
          path.write_text(content.replace("/usr/libexec/path_helper", "/nonexistent/path_helper"))
          PY
          cp "$fake/xcode-select" "$homebrew_fake/"
          cat >"$homebrew_fake/curl" <<'SH'
          #!/bin/sh
          printf 'curl invoked\n' >>"${FAKE_CURL_LOG:?}"
          [ "$#" = 2 ]
          [ "$1" = -fsSL ]
          [ "$2" = https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh ]
          cat <<'INSTALLER'
          [ -t 0 ] || exit 90
          [ -t 1 ] || exit 91
          [ -t 2 ] || exit 92
          printf 'Homebrew confirmation: '
          IFS= read -r answer
          [ "$answer" = confirm ] || exit 93
          printf '%s\n' "$answer" >"${FAKE_INSTALLER_LOG:?}"
          cat >"${FAKE_HOMEBREW_BIN:?}/brew" <<'BREW'
          #!/bin/sh
          case "$1" in
            shellenv) printf 'export HOMEBREW_PREFIX=%s\n' "${FAKE_BREW_PREFIX:?}" ;;
            *) exit 1 ;;
          esac
          BREW
          chmod +x "$FAKE_HOMEBREW_BIN/brew"
          INSTALLER
          SH
          chmod +x "$homebrew_fake/curl"
          chezmoi_bin=$(command -v chezmoi)

          : >"$homebrew_root/non-pty-curl.log"
          if HOME="$homebrew_root/non-pty-home" \
            PATH="$homebrew_fake:/usr/bin:/bin" \
            FAKE_CURL_LOG="$homebrew_root/non-pty-curl.log" \
            "$chezmoi_bin" --source "$homebrew_source" \
              --destination "$homebrew_root/non-pty-home" \
              --config /dev/null --config-format toml \
              --cache "$homebrew_root/non-pty-cache" \
              --persistent-state "$homebrew_root/non-pty-state.boltdb" \
              apply --include=scripts </dev/null \
              >"$homebrew_root/non-pty.out" 2>&1; then
            exit 1
          fi
          grep -F "Homebrew is missing; run '$homebrew_root/non-pty-home/.local/bin/chezmoi apply' again from an interactive terminal" \
            "$homebrew_root/non-pty.out"
          test ! -s "$homebrew_root/non-pty-curl.log"

          : >"$homebrew_root/pty-curl.log"
          : >"$homebrew_root/installer.log"
          HOME="$homebrew_root/pty-home" PATH="$homebrew_fake:/usr/bin:/bin" \
          FAKE_CURL_LOG="$homebrew_root/pty-curl.log" \
          FAKE_INSTALLER_LOG="$homebrew_root/installer.log" \
          FAKE_HOMEBREW_BIN="$homebrew_fake" \
          FAKE_BREW_PREFIX="$homebrew_root/fake-brew" \
          CHEZMOI_BIN="$chezmoi_bin" HOMEBREW_SOURCE="$homebrew_source" \
          HOMEBREW_ROOT="$homebrew_root" \
            /usr/bin/expect <<'EXPECT' >"$homebrew_root/pty.out" 2>&1
          set timeout 10
          spawn -noecho /usr/bin/env \
            HOME=$env(HOME) PATH=$env(PATH) \
            FAKE_CURL_LOG=$env(FAKE_CURL_LOG) \
            FAKE_INSTALLER_LOG=$env(FAKE_INSTALLER_LOG) \
            FAKE_HOMEBREW_BIN=$env(FAKE_HOMEBREW_BIN) \
            FAKE_BREW_PREFIX=$env(FAKE_BREW_PREFIX) \
            $env(CHEZMOI_BIN) --source $env(HOMEBREW_SOURCE) \
              --destination $env(HOMEBREW_ROOT)/pty-home \
              --config /dev/null --config-format toml \
              --cache $env(HOMEBREW_ROOT)/pty-cache \
              --persistent-state $env(HOMEBREW_ROOT)/pty-state.boltdb \
              apply --include=scripts
          expect {
            "Homebrew confirmation: " { send "confirm\r" }
            timeout { exit 94 }
          }
          expect eof
          set status [lindex [wait] 3]
          if {$status != 0} { exit 95 }
          EXPECT
          test "$(cat "$homebrew_root/installer.log")" = confirm
          test "$(cat "$homebrew_root/pty-curl.log")" = 'curl invoked'
          grep -F 'Homebrew confirmation:' "$homebrew_root/pty.out"
          grep -F "export HOMEBREW_PREFIX=$homebrew_root/fake-brew" \
            "$homebrew_root/pty-home/.cache/dotfiles/brew-shellenv"

          HOME="$check_root/home" PATH="$fake:/usr/bin:/bin" \
            XDG_CACHE_HOME="$check_root/cache" \
            FAKE_BREW_PREFIX="$check_root/fake-brew" \
            /bin/sh "$check_root/rendered/run_before_00-ensure-homebrew.sh"
          grep -F "export HOMEBREW_PREFIX=$check_root/fake-brew" \
            "$check_root/cache/dotfiles/brew-shellenv"
          test "$(stat -f '%Lp' "$check_root/cache/dotfiles/brew-shellenv")" = 600

          for command in chezmoi fzf lean-ctx pi python3 rg starship zoxide codex; do
            cat >"$fake/$command" <<'SH'
          #!/bin/sh
          exit 0
          SH
            chmod +x "$fake/$command"
          done
          : >"$check_root/brew.log"
          HOME="$check_root/home" PATH="$fake:/usr/bin:/bin" \
            FAKE_BREW_PREFIX="$check_root/fake-brew" \
            FAKE_BREW_LOG="$check_root/brew.log" \
            /bin/sh "$check_root/rendered/run_onchange_before_10-install-packages.sh"
          python3 - "$check_root/brew.log" <<'PY'
          import pathlib
          import sys
          import tomllib

          packages = tomllib.load(open("home/.chezmoidata/darwin/packages.toml", "rb"))["darwin"]["packages"]
          expected = []
          for logical_id in sorted(packages):
              package = packages[logical_id]
              name = package.get("name", logical_id)
              if (package["kind"], name) in {("formula", "age"), ("cask", "chatgpt")}:
                  continue
              flag = "--cask" if package["kind"] == "cask" else "--formula"
              expected.append(f"install {flag} {name}")
          actual = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert actual == expected, (actual, expected)
          PY

          injection_source="$check_root/injection-source"
          mkdir -p "$injection_source"
          cp .chezmoiroot "$injection_source/"
          cp -R home "$injection_source/home"
          injection_sentinel="$check_root/package-injection-sentinel"
          for fixture in multiline command-substitution; do
            rm -f "$injection_sentinel"
            python3 - \
              "$injection_source/home/.chezmoidata/darwin/packages.toml" \
              "$fixture" "$injection_sentinel" <<'PY'
          import json
          import pathlib
          import sys

          destination = pathlib.Path(sys.argv[1])
          fixture = sys.argv[2]
          sentinel = sys.argv[3]
          if fixture == "multiline":
              encoded_name = f'''"""safe
          touch {sentinel}
          #"""'''
          elif fixture == "command-substitution":
              encoded_name = json.dumps(f"safe'$(touch {sentinel})'")
          else:
              raise AssertionError(f"unknown fixture: {fixture}")
          destination.write_text(
              "[darwin.packages.injection]\n"
              'manager = "homebrew"\n'
              'kind = "formula"\n'
              f"name = {encoded_name}\n"
          )
          PY
            injection_script="$check_root/rendered/package-injection-$fixture.sh"
            chezmoi --source "$injection_source" \
              --destination "$check_root/injection-home" \
              --config "$check_root/config.toml" --config-format toml \
              --cache "$check_root/injection-cache" \
              --persistent-state "$check_root/injection-state.boltdb" \
              execute-template \
              --file home/.chezmoiscripts/darwin/run_onchange_before_10-install-packages.sh.tmpl \
              >"$injection_script"
            /bin/sh -n "$injection_script"
            ! grep -F "$injection_sentinel" "$injection_script" | grep '^#'
            : >"$check_root/injection-brew.log"
            HOME="$check_root/injection-home" PATH="$fake:/usr/bin:/bin" \
              FAKE_BREW_PREFIX="$check_root/fake-brew" \
              FAKE_BREW_LOG="$check_root/injection-brew.log" \
              /bin/sh "$injection_script"
            test ! -e "$injection_sentinel"
          done

          cat >"$fake/code" <<'SH'
          #!/bin/sh
          case "$1" in
            --list-extensions) exit 0 ;;
            --install-extension) printf '%s\n' "$2" >>"${FAKE_CODE_LOG:?}" ;;
            *) exit 1 ;;
          esac
          SH
          cat >"$fake/pi" <<'SH'
          #!/bin/sh
          printf '%s\n' "$*" >>"${FAKE_PI_LOG:?}"
          [ "$1" = list ] || exit 0
          case ${FAKE_PI_MODE:-happy} in
            happy) printf 'extensions ready\n' ;;
            load-marker) printf 'Failed to load extension: fixture\n' >&2 ;;
            start-marker) printf 'Failed to start fixture extension\n' ;;
            nonzero) printf 'pi list fixture failed\n' >&2; exit 42 ;;
            *) exit 99 ;;
          esac
          SH
          chmod +x "$fake/code" "$fake/pi"
          : >"$check_root/code.log"
          HOME="$check_root/home" PATH="$fake:/usr/bin:/bin" \
            FAKE_CODE_LOG="$check_root/code.log" \
            /bin/sh "$check_root/rendered/run_onchange_after_30-install-vscode-extensions.sh"
          expected_extension=$(python3 - <<'PY'
          import tomllib
          extensions = tomllib.load(open("home/.chezmoidata/darwin/vscode.toml", "rb"))["darwin"]["vscode"]["extensions"]
          print("\n".join(extensions))
          PY
          )
          test "$(cat "$check_root/code.log")" = "$expected_extension"

          run_pi_fixture() {
            mode=$1
            status=0
            : >"$check_root/pi.log"
            HOME="$check_root/home" PATH="$fake:/usr/bin:/bin" \
              FAKE_BREW_PREFIX="$check_root/fake-brew" \
              FAKE_PI_LOG="$check_root/pi.log" FAKE_PI_MODE="$mode" \
              /bin/sh "$check_root/rendered/run_onchange_after_40-install-pi-extensions.sh" \
              || status=$?
            test "$(sed -n '1p' "$check_root/pi.log")" = 'update --extensions'
            test "$(sed -n '2p' "$check_root/pi.log")" = 'list'
            test "$(wc -l <"$check_root/pi.log" | tr -d ' ')" = 2
            return "$status"
          }
          run_pi_fixture happy
          for fixture in load-marker start-marker nonzero; do
            if run_pi_fixture "$fixture" >"$check_root/pi-$fixture.out" 2>&1; then
              exit 1
            fi
          done
          grep -F 'Failed to load extension: fixture' "$check_root/pi-load-marker.out"
          grep -F 'Failed to start fixture extension' "$check_root/pi-start-marker.out"
          grep -F 'pi list fixture failed' "$check_root/pi-nonzero.out"

      - name: Build and probe pinned Zsh runtime
        shell: bash
        run: |
          set -euo pipefail
          check_root="$RUNNER_TEMP/dotfiles-check"
          HOME="$check_root/home" \
          XDG_CACHE_HOME="$check_root/cache" \
          XDG_STATE_HOME="$check_root/state" \
            /bin/sh "$check_root/rendered/run_onchange_after_20-build-zsh-plugins.sh"
          /bin/zsh -n "$check_root/cache/zsh/antidote/pre.zsh"
          /bin/zsh -n "$check_root/cache/zsh/antidote/post.zsh"
          cat >"$check_root/zsh-runtime-probe.zsh" <<'ZSH'
          (( $+functions[run-compinit] )) || exit 1
          (( $+functions[compdef] )) || exit 1
          (( $+functions[zvm_init] )) || exit 1
          if ! (( $+functions[fzf-tab-complete] )); then
            zvm_init || exit 1
          fi
          (( $+functions[fzf-tab-complete] )) || exit 1
          (( $+widgets[fzf-tab-complete] )) || exit 1
          (( $+functions[_zsh_autosuggest_start] )) || exit 1
          (( $+functions[_zsh_highlight] )) || exit 1
          [[ -n ${STARSHIP_SHELL:-} ]] || exit 1
          ZSH
          run_zsh_probe() {
            HOME="$check_root/home" \
            ZDOTDIR="$check_root/home" \
            XDG_CACHE_HOME="$check_root/cache" \
            XDG_STATE_HOME="$check_root/state" \
            TERM=xterm-256color \
            DOTFILES_ZSH_PROBE="$1" \
              /usr/bin/script -q -e /dev/null \
                /bin/zsh -lic 'source "$DOTFILES_ZSH_PROBE"'
          }
          run_zsh_probe "$check_root/zsh-runtime-probe.zsh"
          cp "$check_root/zsh-runtime-probe.zsh" "$check_root/zsh-runtime-probe-negative.zsh"
          printf '\nfalse || exit 1\n' >>"$check_root/zsh-runtime-probe-negative.zsh"
          if run_zsh_probe "$check_root/zsh-runtime-probe-negative.zsh" \
            >"$check_root/zsh-runtime-probe-negative.out" 2>&1; then
            exit 1
          fi

      - name: Validate repository contracts and secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .chezmoiroot)" = home
          test ! -e Taskfile.yml
          test ! -e tasks
          test ! -e platform
          test ! -e scripts
          test ! -e bootstrap.sh
          test ! -e docs/architecture.md
          test ! -e context.md
          test ! -e plan.md
          /bin/zsh -n home/dot_zshrc
          STARSHIP_CONFIG="$PWD/home/dot_config/starship.toml" starship print-config >/dev/null
          awk '
            /^[[:space:]]*($|#)/ { next }
            /^[[:space:]]*[a-z0-9-]+[[:space:]]*=[[:space:]]*.+$/ { next }
            { exit 1 }
          ' home/dot_config/ghostty/config
          while IFS= read -r skill; do
            test -f "$skill/SKILL.md"
          done < <(find home/dot_agents/skills -mindepth 1 -maxdepth 1 -type d -print)
          ! find home -name 'exact_*' -print -quit | grep .
          ! git ls-files | grep -E '(^|/)(age\.txt|identity\.txt)$'
          ! git grep -n -E 'AGE-SECRET''-KEY-|-----BEGIN (OPENSSH |RSA |EC )?PRIVATE KEY-----'
          test "$(head -n 1 home/dot_ssh/encrypted_private_id_ed25519.age)" = \
            '-----BEGIN AGE ENCRYPTED FILE-----'
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD --
